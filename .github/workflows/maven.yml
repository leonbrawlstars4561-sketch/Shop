name: Java CI mit Maven

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build mit Maven
        working-directory: NetheriteShop
        run: mvn -B clean package

      - name: Kompiliertes Plugin-JAR als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: NetheriteShop
          path: NetheriteShop/target/*.jar
          if-no-files-found: error
