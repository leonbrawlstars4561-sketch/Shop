name: Java CI mit Maven

# Wird bei Pushes und Pull Requests auf den main-Branch ausgefuehrt,
# sowie manuell ueber "Run workflow" im Actions-Tab.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Aktiviert das eingebaute Maven-Caching (~/.m2) von setup-java.
          cache: maven

      - name: Build mit Maven
        run: mvn -B clean package --file pom.xml

      - name: Kompiliertes Plugin-JAR als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: NetheriteShop
          path: target/*.jar
          if-no-files-found: error
