# ============================================================
#   NetheriteShop - Konfiguration
# ============================================================
# Preise und Items koennen hier angepasst werden, ohne dass das
# Plugin neu kompiliert werden muss. Aenderungen erfordern einen
# /reload oder einen Server-Neustart (bzw. euren eigenen Reload-
# Befehl, falls ihr die Config zur Laufzeit neu ladet).
#
# Verzauberungs-IDs entsprechen den Vanilla-Minecraft-Registry-
# Namen in Kleinbuchstaben, z.B.:
#   protection, unbreaking, mending, respiration, aqua_affinity,
#   thorns, feather_falling, depth_strider, sharpness, knockback,
#   fire_aspect, looting, sweeping_edge, efficiency, fortune
#
# "slot" ist optional (0-53). Wird er weggelassen oder ist ungueltig,
# wird automatisch der naechste freie Slot im 54er-GUI verwendet.

shop:
  items:

    # ---------------- NETHERITE RUESTUNG (je Teil 5.000.000) ----------------
    netherite_helmet:
      slot: 10
      material: NETHERITE_HELMET
      display-name: "Netherite Helm"
      price: 5000000
      enchantments:
        protection: 4
        unbreaking: 3
        mending: 1
        respiration: 3
        aqua_affinity: 1
        thorns: 3

